<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a14" />
    <meta name="description" content="Fairway Next: a calm, one-gesture golf game for your phone or desktop browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fairway Next" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Fairway Next</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1a14; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #view { position: absolute; inset: 0; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; color: #e9efe6; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.02em; background: #0f1a14; transition: opacity 0.5s ease; z-index: 50; }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .mark { font-weight: 300; font-size: 28px; letter-spacing: 0.32em; text-transform: uppercase; }
      #boot .sub { opacity: 0.6; margin-top: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="ui"></div>
      <div id="boot" role="status" aria-live="polite"><div><div class="mark">Fairway Next</div><div class="sub" id="boot-msg">Preparing the course</div></div></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
